[package]
name = "dm-disasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
auxtools = { path = "auxtools-local/auxtools" }
dmasm = { git = "https://github.com/willox/dmasm", branch = "master" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
